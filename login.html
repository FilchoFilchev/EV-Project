<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to EchoVault" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <title>Login | EchoVault</title>
  </head>
  <body>
    <div id="app" data-page="login">
      <div id="navbar"></div>
      <main id="page-content" class="container py-5">
        <div class="row justify-content-center">
          <section class="col-12 col-sm-10 col-md-8 col-lg-5" aria-labelledby="login-heading">
            <h1 id="login-heading" class="h2 mb-2 text-center">Sign in</h1>
            <p class="text-secondary text-center mb-4">Welcome back to your EchoVault account.</p>
            <form id="login-form" class="card card-body shadow-sm" novalidate>
              <div id="login-message" class="alert d-none mb-3" role="status" aria-live="polite" aria-atomic="true" hidden></div>
              <div class="mb-3">
                <label class="form-label" for="login-email">Email</label>
                <input class="form-control" id="login-email" name="email" type="email" autocomplete="email" maxlength="254" aria-describedby="login-email-error" required />
                <span class="form-text text-danger" id="login-email-error" hidden></span>
              </div>
              <div class="mb-4">
                <label class="form-label" for="login-password">Password</label>
                <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-password-error" required />
                <span class="form-text text-danger" id="login-password-error" hidden></span>
              </div>
              <button class="btn btn-primary" type="submit">Sign in</button>
              <p class="mt-3 mb-0">New here? <a href="/register.html">Create an account</a></p>
            </form>
          </section>
        </div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/js/pages/loginPage.js"></script>
  </body>
</html>
