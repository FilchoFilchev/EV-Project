<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an EchoVault account" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <title>Register | EchoVault</title>
  </head>
  <body>
    <div id="app" data-page="register">
      <div id="navbar"></div>
      <main id="page-content" class="container py-5">
        <div class="row justify-content-center">
          <section class="col-12 col-sm-10 col-md-8 col-lg-6" aria-labelledby="register-heading">
            <h1 id="register-heading" class="h2 mb-2 text-center">Create your account</h1>
            <p class="text-secondary text-center mb-4">Start recording, transforming, and sharing your voice.</p>
            <form id="register-form" class="card card-body shadow-sm" novalidate>
              <div id="register-message" class="alert d-none mb-3" role="status" aria-live="polite" aria-atomic="true" hidden></div>
              <div class="mb-3">
                <label class="form-label" for="display-name">Display name</label>
                <input class="form-control" id="display-name" name="displayName" autocomplete="name" maxlength="100" aria-describedby="display-name-error" required />
                <span class="form-text text-danger" id="display-name-error" hidden></span>
              </div>
              <div class="mb-3">
                <label class="form-label" for="register-email">Email</label>
                <input class="form-control" id="register-email" name="email" type="email" autocomplete="email" maxlength="254" aria-describedby="register-email-error" required />
                <span class="form-text text-danger" id="register-email-error" hidden></span>
              </div>
              <div class="mb-3">
                <label class="form-label" for="register-password">Password</label>
                <input class="form-control" id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="register-password-error" required />
                <span class="form-text text-danger" id="register-password-error" hidden></span>
              </div>
              <div class="mb-3">
                <label class="form-label" for="confirm-password">Confirm password</label>
                <input class="form-control" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" aria-describedby="confirm-password-error" required />
                <span class="form-text text-danger" id="confirm-password-error" hidden></span>
              </div>
              <div class="mb-3">
                <div class="form-check">
                  <input class="form-check-input" id="rights-confirmation" name="rightsConfirmation" type="checkbox" aria-describedby="rights-confirmation-error" required />
                  <label class="form-check-label" for="rights-confirmation">I confirm that I have the rights and permission to use voices I share.</label>
                </div>
                <span class="form-text text-danger" id="rights-confirmation-error" hidden></span>
              </div>
              <button class="btn btn-primary" type="submit">Create account</button>
              <p class="mt-3 mb-0">Already have an account? <a href="/login.html">Sign in</a></p>
            </form>
          </section>
        </div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/js/pages/registerPage.js"></script>
  </body>
</html>
