<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an EchoVault account" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <title>Register | EchoVault</title>
  </head>
  <body>
    <div id="app" data-page="register">
      <div id="navbar"></div>
      <main class="container py-5">
        <div class="row justify-content-center">
          <section class="col-md-8 col-lg-6" aria-labelledby="register-heading">
            <h1 id="register-heading" class="h2 mb-4">Create your account</h1>
            <form class="card card-body shadow-sm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="display-name">Display name</label>
                <input class="form-control" id="display-name" name="displayName" autocomplete="name" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="register-email">Email</label>
                <input class="form-control" id="register-email" name="email" type="email" autocomplete="email" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="register-password">Password</label>
                <input class="form-control" id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="confirm-password">Confirm password</label>
                <input class="form-control" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required />
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" id="rights-confirmation" type="checkbox" required />
                <label class="form-check-label" for="rights-confirmation">I confirm that I have the rights and permission to use uploaded voices.</label>
              </div>
              <button class="btn btn-primary" type="submit" disabled>Create account</button>
            </form>
          </section>
        </div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/js/pages/registerPage.js"></script>
  </body>
</html>
