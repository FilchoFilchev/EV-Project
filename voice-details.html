<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <link rel="stylesheet" href="/src/css/marketplace.css" />
    <title>Voice Details | EchoVault</title>
  </head>
  <body>
    <div id="app" data-page="marketplace" data-auth-state="pending">
      <div id="navbar"></div>
      <main id="page-content" class="container py-5">
        <a class="link-secondary" href="/marketplace.html">&larr; Back to Marketplace</a>
        <h1 id="details-title" class="h2 mt-3">Voice details</h1>
        <p id="details-status" class="text-secondary mt-4" role="status" aria-live="polite">Loading listing details…</p>
        <div id="details-error" class="alert alert-warning mt-4" role="alert" hidden>
          <p id="details-error-message" class="mb-2"></p>
          <button id="details-retry" class="btn btn-outline-primary" type="button">Try again</button>
        </div>
        <div id="details-content" class="row g-4 mt-1" aria-busy="true" hidden></div>
      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/js/pages/voiceDetailsPage.js"></script>
  </body>
</html>
